name: Build and Dockerize Java App

on:
  push:
    branches:
      - '**'
  create:
    branches:
      - '**'

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    # cancel any in-progress runs of this workflow on the same ref (branch or tag)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Clean Docker
        run: docker system prune -af --volumes

      - name: Clean workspace
        run: rm -rf $GITHUB_WORKSPACE/*

      - name: Clean Maven
        run: rm -rf ~/.m2/repository/*

      - name: Clean Gradle
        run: rm -rf ~/.gradle/caches/

      # Checkout repo
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set version tags
        id: vars
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^release/ ]]; then
            VERSION="${GITHUB_REF_NAME#release/}"  # extract "1.2.0" from "release/1.2.0"
            echo "TAG=${VERSION}" >> $GITHUB_ENV
            echo "LATEST=latest" >> $GITHUB_ENV
          else
            BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            echo "TAG=${BRANCH}" >> $GITHUB_ENV
          fi

      # Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Spring Boot runnable JAR
        run: ./gradlew :printhelm-web-service:bootJar

      - name: Build Service Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/printhelm-service:${TAG}
          echo "Building image: $IMAGE"
          docker build \
            --build-arg JAR_FILE=${JAR_FILE} \
            -f printhelm-web-service/Dockerfile \
            -t $IMAGE \
            .
          if [ -n "${LATEST:-}" ]; then
            docker tag $IMAGE ghcr.io/${{ github.repository_owner }}/printhelm-service:latest
          fi

      - name: Build Frontend Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/printhelm-frontend:${TAG}
          echo "Building image: $IMAGE"
          docker build \
            -f printhelm-vue/Dockerfile \
            -t $IMAGE \
            .
          if [ -n "${LATEST:-}" ]; then
            docker tag $IMAGE ghcr.io/${{ github.repository_owner }}/printhelm-frontend:latest
          fi

      - name: Authenticate to GCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Service Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/printhelm-service:${TAG}
          docker push $IMAGE
          if [ -n "${LATEST:-}" ]; then
            docker push ghcr.io/${{ github.repository_owner }}/printhelm-service:latest
          fi

      - name : Push Frontend Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/printhelm-frontend:${TAG}
          docker push $IMAGE
          if [ -n "${LATEST:-}" ]; then
            docker push ghcr.io/${{ github.repository_owner }}/printhelm-frontend:latest
          fi