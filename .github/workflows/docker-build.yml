name: Build and Dockerize Java App

on:
  push:
    branches:
      - '**'
  create:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-service:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clean workspace
        run: rm -rf $GITHUB_WORKSPACE/*

      - name: Clean Docker
        run: docker system prune -af --volumes

      - name: Clean Gradle cache
        run: rm -rf ~/.gradle/caches/

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set version tags
        id: vars
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^release/ ]]; then
            VERSION="${GITHUB_REF_NAME#release/}"
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
            echo "latest=latest" >> $GITHUB_OUTPUT
          else
            BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            echo "tag=${BRANCH}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Spring Boot runnable JAR
        run: ./gradlew :printhelm-web-service:bootJar

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Service Docker image
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          LATEST: ${{ steps.vars.outputs.latest }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/printhelm-service:${TAG}
          docker build -f printhelm-web-service/Dockerfile -t $IMAGE .
          docker push $IMAGE
          if [ -n "${LATEST}" ]; then
            docker tag $IMAGE ghcr.io/${{ github.repository_owner }}/printhelm-service:latest
            docker push ghcr.io/${{ github.repository_owner }}/printhelm-service:latest
          fi

  build-frontend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clean workspace
        run: rm -rf $GITHUB_WORKSPACE/*

      - name: Clean Docker
        run: docker system prune -af --volumes

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set version tags
        id: vars
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^release/ ]]; then
            VERSION="${GITHUB_REF_NAME#release/}"
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
            echo "latest=latest" >> $GITHUB_OUTPUT
          else
            BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            echo "tag=${BRANCH}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          LATEST: ${{ steps.vars.outputs.latest }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/printhelm-frontend:${TAG}
          docker build -f printhelm-vue/Dockerfile -t $IMAGE .
          docker push $IMAGE
          if [ -n "${LATEST}" ]; then
            docker tag $IMAGE ghcr.io/${{ github.repository_owner }}/printhelm-frontend:latest
            docker push ghcr.io/${{ github.repository_owner }}/printhelm-frontend:latest
          fi
