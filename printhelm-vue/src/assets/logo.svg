<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Print head body -->
  <rect x="22" y="18" width="56" height="28" rx="4"
        fill="#22d3ee" fill-opacity="0.12" stroke="url(#g)" stroke-width="2"/>

  <!-- Nozzle taper -->
  <path d="M22 46 L78 46 L58 68 L42 68 Z" fill="#22d3ee" opacity="0.9"/>

  <!-- Nozzle tip block -->
  <rect x="42" y="68" width="16" height="7" rx="2" fill="url(#g)"/>

  <!-- Tip glow dot -->
  <circle cx="50" cy="79" r="4" fill="#a5f3fc" filter="url(#glow)">
    <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Ripple ring -->
  <circle cx="50" cy="79" r="4" fill="none" stroke="#22d3ee" stroke-width="1.5">
    <animate attributeName="r" from="4" to="16" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.75" to="0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
