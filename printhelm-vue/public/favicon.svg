<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0a1929"/>

  <!-- Print head body -->
  <rect x="6" y="5" width="20" height="10" rx="2"
        fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- Nozzle taper -->
  <path d="M6 15 L26 15 L20 23 L12 23 Z" fill="#22d3ee" opacity="0.9"/>

  <!-- Nozzle tip block -->
  <rect x="12" y="23" width="8" height="4" rx="1" fill="url(#g)"/>

  <!-- Tip glow dot -->
  <circle cx="16" cy="29" r="2" fill="#a5f3fc">
    <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
