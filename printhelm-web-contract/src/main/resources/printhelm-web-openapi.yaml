openapi: 3.0.3
info:
  title: PrintHelm API
  version: 1.0.0
  description: PrintHelm API OpenAPI Specification
servers:
  - url: https://printhelm.czagrzebski.dev/api/v1
    description: Production server
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://staging.printhelm.czagrzebski.dev/api/v1
    description: Staging server

paths:
  # === AuthController ===
  /auth/login:
    post:
      tags:
        - Auth
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiLoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuthResponse'
        '401':
          description: Unauthorized

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      operationId: refresh
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuthResponse'
        '401':
          description: Invalid refresh token

  /auth/logout:
    post:
      tags:
        - Auth
      summary: User logout
      operationId: logout
      responses:
        '200':
          description: Successful logout
        '401':
          description: Unauthorized

  # === UserController ===
  /user/createUser:
    post:
      tags:
        - User
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /user:
    get:
      tags:
        - User
      summary: Get all users
      operationId: getUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiUserResponse'
        '403':
          description: Forbidden
  /user/me:
    get:
      tags:
        - User
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserResponse'
  /user/me/password:
    put:
      tags:
        - User
      summary: Change own password
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          description: Bad Request
  /user/{id}:
    get:
      tags:
        - User
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserResponse'
        '404':
          description: Not found
    put:
      tags:
        - User
      summary: Update a user
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiUpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserResponse'
        '404':
          description: Not found
    delete:
      tags:
        - User
      summary: Delete a user
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: User deleted
        '404':
          description: Not found
  /user/{id}/password:
    put:
      tags:
        - User
      summary: Admin reset user password
      operationId: adminResetPassword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiAdminResetPasswordRequest'
      responses:
        '204':
          description: Password reset
        '404':
          description: Not found
  # === RoleController ===
  /role:
    get:
      tags:
        - Role
      summary: Get all roles
      operationId: getRoles
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiRole'
  # == PrinterController ===
  /printer:
    get:
      tags:
        - Printer
      summary: Get all printers
      operationId: getPrinters
      responses:
        '200':
          description: List of printers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiPrinterResponse'
        '401':
          description: Unauthorized
  /printer/{id}:
    get:
      tags:
        - Printer
      summary: Get a printer by ID
      operationId: getPrinterById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Printer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPrinterResponse'
        '404':
          description: Not found
    put:
      tags:
        - Printer
      summary: Update a printer
      operationId: updatePrinter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiUpdatePrinterRequest'
      responses:
        '200':
          description: Printer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPrinterResponse'
        '404':
          description: Not found
    delete:
      tags:
        - Printer
      summary: Delete a printer
      operationId: deletePrinter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Printer deleted
        '404':
          description: Not found
  # === PrinterCommandController ===
  /printer/{id}/command/stop:
    post:
      tags:
        - PrinterCommands
      summary: Stop the current print
      operationId: stopPrint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Command sent
        '409':
          description: Printer not connected

  /printer/{id}/command/pause:
    post:
      tags:
        - PrinterCommands
      summary: Pause the current print
      operationId: pausePrint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Command sent
        '409':
          description: Printer not connected

  /printer/{id}/command/resume:
    post:
      tags:
        - PrinterCommands
      summary: Resume the current print
      operationId: resumePrint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Command sent
        '409':
          description: Printer not connected

  /printer/{id}/command/speed:
    post:
      tags:
        - PrinterCommands
      summary: Set print speed level
      operationId: setSpeed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSpeedRequest'
      responses:
        '204':
          description: Command sent
        '409':
          description: Printer not connected

  /printer/{id}/command/jog:
    post:
      tags:
        - PrinterCommands
      summary: Jog an axis
      operationId: jogAxis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiJogRequest'
      responses:
        '204':
          description: Command sent
        '409':
          description: Printer not connected

  /printer/{id}/command/home:
    post:
      tags:
        - PrinterCommands
      summary: Home all axes
      operationId: homeAxes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Command sent
        '409':
          description: Printer not connected

  /printer/{id}/command/nozzle-temp:
    post:
      tags:
        - PrinterCommands
      summary: Set nozzle target temperature
      operationId: setNozzleTemp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTempRequest'
      responses:
        '204':
          description: Command sent
        '400':
          description: Temperature out of range (0–300°C)
        '409':
          description: Printer not connected

  /printer/{id}/command/bed-temp:
    post:
      tags:
        - PrinterCommands
      summary: Set bed target temperature
      operationId: setBedTemp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTempRequest'
      responses:
        '204':
          description: Command sent
        '400':
          description: Temperature out of range (0–110°C)
        '409':
          description: Printer not connected

  /printer/{id}/command/light:
    post:
      tags:
        - PrinterCommands
      summary: Set light state
      operationId: setLight
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiLightRequest'
      responses:
        '204':
          description: Command sent
        '409':
          description: Printer not connected

  /printer/{id}/command/print:
    post:
      tags:
        - PrinterCommands
      summary: Start a print job
      operationId: startPrint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiPrintFileRequest'
      responses:
        '204':
          description: Command sent
        '409':
          description: Printer not connected

  # === PrinterFileController ===
  /printer/{id}/files:
    get:
      tags:
        - PrinterFiles
      summary: List files on printer storage
      operationId: listPrinterFiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiPrinterFile'
        '502':
          description: Error communicating with printer
    post:
      tags:
        - PrinterFiles
      summary: Upload a file to printer storage
      operationId: uploadPrinterFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '204':
          description: File uploaded
        '400':
          description: Bad request
        '502':
          description: Error communicating with printer

  /printer/{id}/files/{filename}:
    get:
      tags:
        - PrinterFiles
      summary: Download a file from printer storage
      operationId: downloadPrinterFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '502':
          description: Error communicating with printer
    delete:
      tags:
        - PrinterFiles
      summary: Delete a file from printer storage
      operationId: deletePrinterFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: File deleted
        '502':
          description: Error communicating with printer

  # === PrintQueueController ===
  /printer/{printerId}/queue:
    get:
      tags:
        - PrintQueue
      summary: Get the print queue for a printer
      operationId: getPrinterQueue
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ordered list of queued job orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiJobOrderResponse'
        '404':
          description: Printer not found
    post:
      tags:
        - PrintQueue
      summary: Assign a job order to a printer's queue
      operationId: addJobToQueue
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiQueueJobRequest'
      responses:
        '201':
          description: Job assigned to queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobOrderResponse'
        '400':
          description: Bad request (e.g. job not in READY_TO_PRINT status)
        '409':
          description: Job already assigned to a printer
    patch:
      tags:
        - PrintQueue
      summary: Reorder jobs in the print queue
      operationId: reorderQueue
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiQueueReorderRequest'
      responses:
        '204':
          description: Queue reordered
        '400':
          description: Bad request

  /printer/{printerId}/queue/{jobOrderId}:
    delete:
      tags:
        - PrintQueue
      summary: Remove a job order from the print queue
      operationId: removeJobFromQueue
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: jobOrderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Job removed from queue
        '404':
          description: Not found

  /printer/{printerId}/queue/{jobOrderId}/start:
    post:
      tags:
        - PrintQueue
      summary: Start printing a queued job
      operationId: startQueuedJob
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: jobOrderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiQueueStartRequest'
      responses:
        '204':
          description: Print started
        '400':
          description: Bad request
        '409':
          description: Printer already printing or printer not connected

  # === JobOrderController ===
  /job-order:
    get:
      tags:
        - JobOrder
      summary: Get all job orders
      operationId: getJobOrders
      responses:
        '200':
          description: List of job orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiJobOrderResponse'
    post:
      tags:
        - JobOrder
      summary: Create a new job order
      operationId: createJobOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateJobOrderRequest'
      responses:
        '201':
          description: Job order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobOrderResponse'
        '400':
          description: Bad Request
  /job-order/{id}:
    get:
      tags:
        - JobOrder
      summary: Get a job order by ID
      operationId: getJobOrderById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Job order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobOrderResponse'
        '404':
          description: Not found
    put:
      tags:
        - JobOrder
      summary: Update a job order
      operationId: updateJobOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiUpdateJobOrderRequest'
      responses:
        '200':
          description: Job order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobOrderResponse'
        '404':
          description: Not found
    delete:
      tags:
        - JobOrder
      summary: Delete a job order
      operationId: deleteJobOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Job order deleted
        '404':
          description: Not found

  /job-order/{id}/part-file:
    post:
      tags:
        - JobOrder
      summary: Upload 3D part file for a job order
      operationId: uploadJobOrderPartFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded; returns updated job order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobOrderResponse'
        '404':
          description: Job order not found
    get:
      tags:
        - JobOrder
      summary: Download 3D part file for a job order
      operationId: downloadJobOrderPartFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Job order or file not found

  /job-order/{id}/gcode-file:
    post:
      tags:
        - JobOrder
      summary: Upload GCode file for a job order
      operationId: uploadJobOrderGcodeFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded; returns updated job order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobOrderResponse'
        '404':
          description: Job order not found
    get:
      tags:
        - JobOrder
      summary: Download GCode file for a job order
      operationId: downloadJobOrderGcodeFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Job order or file not found

  /printer/{id}/diagnose:
    post:
      tags:
        - Printer
      summary: Run an AI-powered diagnostic on a printer
      operationId: diagnosePrinter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Diagnostic report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDiagnosticReport'
        '404':
          description: Printer not found

  /printer/createPrinter:
    post:
      tags:
        - Printer
      summary: Create a new printer
      operationId: createPrinter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreatePrinterRequest'
      responses:
        '201':
          description: Printer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  printerId:
                    type: long
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # === NotificationController ===
  /notifications:
    get:
      tags:
        - Notifications
      summary: Get all notifications
      operationId: getAllNotifications
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiNotification'

  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Get count of unacknowledged notifications
      operationId: getUnreadNotificationCount
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnreadCountResponse'

  /notifications/acknowledge-all:
    put:
      tags:
        - Notifications
      summary: Acknowledge all notifications
      operationId: acknowledgeAllNotifications
      responses:
        '204':
          description: All notifications acknowledged

  /notifications/clear-acknowledged:
    delete:
      tags:
        - Notifications
      summary: Delete all acknowledged notifications
      operationId: clearAcknowledgedNotifications
      responses:
        '204':
          description: Acknowledged notifications cleared

  /notifications/printer/{printerId}:
    get:
      tags:
        - Notifications
      summary: Get notifications for a specific printer
      operationId: getNotificationsByPrinter
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of notifications for the printer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiNotification'

  /notifications/{id}/acknowledge:
    put:
      tags:
        - Notifications
      summary: Acknowledge a single notification
      operationId: acknowledgeNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Notification acknowledged
        '404':
          description: Not found

  /notifications/{id}:
    delete:
      tags:
        - Notifications
      summary: Delete a notification
      operationId: deleteNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Notification deleted
        '404':
          description: Not found

  # === ChatController ===
  /chat/message:
    post:
      summary: Send a message to the AI assistant
      operationId: sendChatMessage
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiChatRequest'
      responses:
        '200':
          description: AI response message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiChatResponse'

  /chat/sessions:
    get:
      summary: List all chat sessions for the current user
      operationId: getChatSessions
      tags:
        - Chat
      responses:
        '200':
          description: List of chat session summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiChatSessionSummary'

  /chat/sessions/{sessionId}:
    get:
      summary: Get full message history for a chat session
      operationId: getChatSession
      tags:
        - Chat
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chat session with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiChatSessionDetail'
        '404':
          description: Session not found
    delete:
      summary: Delete a chat session
      operationId: deleteChatSession
      tags:
        - Chat
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session deleted
        '404':
          description: Session not found

components:
  schemas:
    NotificationType:
      type: string
      enum: [PRINT_JOB_STARTED, PRINT_STARTED, PRINT_PAUSED, PRINT_RESUMED, PRINT_COMPLETED, PRINT_STOPPED, PRINT_FAILED, PRINT_ERROR, JOB_QUEUED]
    NotificationSeverity:
      type: string
      enum: [INFO, WARNING, ERROR]
    ApiNotification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        printerId:
          type: integer
          format: int64
        printerName:
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
        title:
          type: string
        message:
          type: string
        file:
          type: string
        acknowledged:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ApiUnreadCountResponse:
      type: object
      properties:
        count:
          type: integer
          format: int64
    PrinterType:
      type: string
      enum: [BAMBULAB, PRUSA, ANYCUBIC, EPAX, ELEGOO, OTHER]
    ConnectionType:
      type: string
      enum: [USB, NETWORK, SERIAL, BLUETOOTH, MQTT]
    ApiCreatePrinterRequest:
      type: object
      required:
        - printerName
        - type
        - model
        - connectionConfig
      properties:
        printerName:
          type: string
        printerType:
          $ref: '#/components/schemas/PrinterType'
        printerModel:
          type: string
        location:
            type: string
        serialNumber:
            type: string
        connectionConfig:
          $ref: '#/components/schemas/ApiConnectionConfig'
    ApiConnectionConfig:
      type: object
      required:
