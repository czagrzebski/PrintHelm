        file:
          type: string
        timestamp:
          type: string
          format: date-time
        progress:
          type: number
        wifiSignalStrength:
          type: string
        subtaskName:
          type: string
        subtaskId:
          type: string
        nozzleType:
          type: string
        remainTime:
